<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* YoLoLlevo — motor de sincronización con Supabase (reemplaza localStorage).
   Se carga ANTES del bundle principal de la app, así todo lo que define
   queda listo en window para cuando la app lo use. */
(function () {
  "use strict";

  var SUPABASE_URL = "https://nbekycvrvfujafddfwjy.supabase.co";
  var SUPABASE_KEY = "sb_publishable_8fX2brcFoolr2AQQUwNzLQ_QDpPDZhW";

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true },
  });
  window.__sb = sb;

  // ---- conversión camelCase <-> snake_case, solo en las claves de primer nivel ----
  function camelToSnake(s) {
    return s.replace(/[A-Z]/g, function (m) { return "_" + m.toLowerCase(); });
  }
  function snakeToCamel(s) {
    return s.replace(/_([a-z0-9])/g, function (_, c) { return c.toUpperCase(); });
  }
  function rowToDb(obj) {
    var out = {};
    for (var k in obj) {
      if (Object.prototype.hasOwnProperty.call(obj, k)) out[camelToSnake(k)] = obj[k];
    }
    return out;
  }
  function rowFromDb(obj) {
    var out = {};
    for (var k in obj) {
      if (Object.prototype.hasOwnProperty.call(obj, k)) out[snakeToCamel(k)] = obj[k];
    }
    return out;
  }

  // ---- mapa de claves tsr_* -> tabla de Supabase ----
  // nullableArrayFields: columnas jsonb (en snake_case) que en la base son
  // "not null default '[]'" pero que la app a veces manda como null explicito
  // (ej: "desglose" en gastos, cuando no se usa "Desglosar entre varias OT").
  // Si no se corrige antes de mandar, Postgres rechaza el insert/update entero
  // por violar el NOT NULL -- y la app no se entera porque no revisa el error.
  var TABLE_MAP = {
    tsr_clientes: { table: "clientes" },
    tsr_vehiculos_global: { table: "vehiculos" },
    tsr_specs_aceites: { table: "specs_aceites", keyFields: ["marca", "modelo", "motor"], noDelete: true },
    tsr_citas: { table: "citas" },
    tsr_inspecciones: { table: "inspecciones" },
    tsr_presupuestos: { table: "presupuestos" },
    tsr_ordenes: { table: "ordenes" },
    tsr_facturas: { table: "facturas" },
    tsr_gastos: { table: "gastos", nullableArrayFields: ["desglose"] },
    tsr_auditoria: { table: "auditoria" },
  };

  function fixNullableArrays(row, fields) {
    if (!fields) return row;
    var out = row;
    for (var i = 0; i < fields.length; i++) {
      var f = fields[i];
      if (out[f] === null || out[f] === undefined) {
        if (out === row) out = Object.assign({}, row); // no mutar el original
        out[f] = [];
      }
    }
    return out;
  }

  // Modo de sincronización para una clave tsr_*: 'array' | 'config' | 'usuarios' | null
  // (null = clave no mapeada a la nube, sigue funcionando con localStorage como antes)
  window.__cloudTableFor = function (key) {
    if (key === "tsr_config") return "config";
    if (key === "tsr_usuarios") return "usuarios";
    return TABLE_MAP[key] ? "array" : null;
  };

  function rowIdentity(row, keyFields) {
    return keyFields.map(function (k) { return String(row[k]); }).join("|");
  }

  window.__cloudFetchArray = async function (key) {
    var cfg = TABLE_MAP[key];
    try {
      var res = await sb.from(cfg.table).select("*");
      if (res.error) { console.warn("[cloud] fetch", cfg.table, res.error); return []; }
      return (res.data || []).map(rowFromDb);
    } catch (e) {
      console.warn("[cloud] fetch (excepcion)", cfg.table, e);
      return [];
    }
  };

  window.__cloudSyncArrayDiff = async function (key, prevArr, nextArr) {
    var cfg = TABLE_MAP[key];
    var keyFields = cfg.keyFields || ["id"];
    var prevMap = new Map((prevArr || []).map(function (r) { return [rowIdentity(r, keyFields), r]; }));
    var nextMap = new Map((nextArr || []).map(function (r) { return [rowIdentity(r, keyFields), r]; }));
    var toUpsert = [];
    nextMap.forEach(function (row, k) {
      var prev = prevMap.get(k);
      if (!prev || JSON.stringify(prev) !== JSON.stringify(row)) toUpsert.push(row);
    });
    try {
      if (toUpsert.length) {
        var onConflict = keyFields.map(camelToSnake).join(",");
        var fixedUpsert = toUpsert.map(function (r) { return fixNullableArrays(r, cfg.nullableArrayFields); });
        var res = await sb.from(cfg.table).upsert(fixedUpsert.map(rowToDb), { onConflict: onConflict });
        if (res.error) console.warn("[cloud] upsert", cfg.table, res.error, toUpsert);
      }
      if (!cfg.noDelete) {
        var toDeleteIds = [];
        prevMap.forEach(function (row, k) { if (!nextMap.has(k)) toDeleteIds.push(row.id); });
        if (toDeleteIds.length) {
          var resD = await sb.from(cfg.table).delete().in("id", toDeleteIds);
          if (resD.error) console.warn("[cloud] delete", cfg.table, resD.error);
        }
      }
    } catch (e) {
      console.warn("[cloud] sync (excepcion)", cfg.table, e);
    }
  };

  // ---- config: una sola fila (id=1), todo el objeto vive en la columna jsonb "data" ----
  window.__cloudFetchConfig = async function () {
    try {
      var res = await sb.from("config").select("data").eq("id", 1).single();
      if (res.error || !res.data) { console.warn("[cloud] fetch config", res.error); return null; }
      return res.data.data || {};
    } catch (e) {
      console.warn("[cloud] fetch config (excepcion)", e);
      return null;
    }
  };
  window.__cloudSyncConfig = async function (next) {
    try {
      var res = await sb.from("config").update({ data: next }).eq("id", 1);
      if (res.error) console.warn("[cloud] sync config", res.error);
    } catch (e) {
      console.warn("[cloud] sync config (excepcion)", e);
    }
  };

  // ---- usuarios: viven en Supabase Auth + tabla perfiles, no en una tabla propia ----
  window.__cloudFetchUsuarios = async function () {
    try {
      var res = await sb.from("perfiles").select("*");
      if (res.error || !res.data) return [];
      return res.data.map(function (p) {
        return { id: p.id, usuario: p.usuario, nombre: p.nombre, rol: p.rol, activo: p.activo };
      });
    } catch (e) {
      console.warn("[cloud] fetch usuarios (excepcion)", e);
      return [];
    }
  };

  function perfilAUsuario(p) {
    return { id: p.id, usuario: p.usuario, nombre: p.nombre, rol: p.rol, activo: p.activo };
  }

  window.__cloudSignIn = async function (usuario, password) {
    var email = String(usuario || "").trim().toLowerCase() + "@sistema.yolollevo.internal";
    try {
      var res = await sb.auth.signInWithPassword({ email: email, password: password });
      if (res.error || !res.data || !res.data.user) {
        return { error: "Usuario o contrasena incorrectos." };
      }
      var pres = await sb.from("perfiles").select("*").eq("id", res.data.user.id).single();
      if (pres.error || !pres.data) {
        await sb.auth.signOut();
        return { error: "Usuario o contrasena incorrectos." };
      }
      if (!pres.data.activo) {
        await sb.auth.signOut();
        return { error: "Tu usuario esta inactivo. Contacta al administrador." };
      }
      return { user: perfilAUsuario(pres.data) };
    } catch (e) {
      console.warn("[cloud] signIn (excepcion)", e);
      return { error: "No se pudo conectar. Revisa tu conexion a internet e intenta de nuevo." };
    }
  };

  window.__cloudSignOut = async function () {
    try { await sb.auth.signOut(); } catch (e) { console.warn("[cloud] signOut", e); }
  };

  // Usa un cliente Supabase APARTE (sin persistir sesión) para que crear un
  // usuario nuevo no reemplace la sesión del admin que lo está creando --
  // si usáramos el cliente principal (sb), signUp() te loguearía como el
  // usuario recién creado y desconectaría al admin sin avisar.
  window.__cloudSignUp = async function (opts) {
    var usuario = String(opts.usuario || "").trim().toLowerCase();
    var email = usuario + "@sistema.yolollevo.internal";
    var tempClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false },
    });
    try {
      var res = await tempClient.auth.signUp({
        email: email,
        password: opts.password,
        options: { data: { usuario: usuario, nombre: opts.nombre || "", rol: opts.rol || "tecnico", activo: true } },
      });
      if (res.error || !res.data || !res.data.user) {
        return { error: (res.error && res.error.message) || "No se pudo crear el usuario." };
      }
      var uid = res.data.user.id;
      var perfil = null;
      for (var i = 0; i < 6 && !perfil; i++) {
        var pres = await sb.from("perfiles").select("*").eq("id", uid).single();
        if (pres.data) { perfil = pres.data; break; }
        await new Promise(function (r) { setTimeout(r, 300); });
      }
      if (!perfil) {
        return { error: "Se creo el usuario pero no se pudo confirmar el perfil todavia. Refresca la pagina en unos segundos." };
      }
      return { user: perfilAUsuario(perfil) };
    } catch (e) {
      console.warn("[cloud] signUp (excepcion)", e);
      return { error: "No se pudo conectar. Revisa tu conexion a internet e intenta de nuevo." };
    }
  };

  window.__cloudTogglePerfilActivo = async function (id, activo) {
    try {
      var res = await sb.from("perfiles").update({ activo: activo }).eq("id", id);
      if (res.error) console.warn("[cloud] toggle activo", res.error);
    } catch (e) {
      console.warn("[cloud] toggle activo (excepcion)", e);
    }
  };

  // Reemplaza el único punto donde el sistema escribía tsr_citas directo en
  // localStorage (sincronización OT -> Cita), sin pasar por el estado de React
  // del módulo de Citas. Acá hace lo mismo pero contra la tabla citas.
  // Cada hook de yt() se suscribe a esto para saber cuando (re)cargar sus datos:
  // dispara al iniciar (con la sesion ya restaurada si habia una) y en cada
  // login/logout/renovacion de token. Sin esto, un fetch hecho antes de
  // terminar el login quedaria pegado vacio para siempre (RLS lo bloquea).
  window.__cloudOnAuth = function (cb) {
    var sub = sb.auth.onAuthStateChange(function (event, session) {
      cb(event, session);
    });
    return function () {
      try { sub.data.subscription.unsubscribe(); } catch (e) { /* noop */ }
    };
  };

  window.__cloudSyncCitaEstado = async function (citaId, nuevoEstado, fecha) {
    try {
      var res = await sb.from("citas").select("*").eq("id", citaId).single();
      if (res.error || !res.data) return;
      var cita = rowFromDb(res.data);
      if (cita.estado === nuevoEstado) return;
      var historial = (cita.historialEstados || []).concat([{ estado: nuevoEstado, fecha: fecha }]);
      var upd = await sb.from("citas").update({ estado: nuevoEstado, historial_estados: historial }).eq("id", citaId);
      if (upd.error) console.warn("[cloud] sync cita estado", upd.error);
    } catch (e) {
      console.warn("[cloud] sync cita estado (excepcion)", e);
    }
  };
})();

</script>
<script>
window._anthropic = async function(body) {
  const key = localStorage.getItem('tsr_api_key');
  if (!key) { document.getElementById('api-panel').style.display='block'; document.getElementById('api-btn').style.display='none'; throw new Error('Configurá tu API key'); }
  const r = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}, body:JSON.stringify(body) });
  return r.json();
};
function _saveKey() {
  const key = document.getElementById('api-input').value.trim();
  if (!key.startsWith('sk-ant-')) { document.getElementById('api-status').textContent='❌ Debe empezar con sk-ant-'; return; }
  localStorage.setItem('tsr_api_key', key);
  document.getElementById('api-status').textContent='✅ Key guardada';
  const btn = document.getElementById('api-btn');
  btn.textContent='✅ IA activa'; btn.style.background='#1a8a4e';
  setTimeout(()=>{ document.getElementById('api-panel').style.display='none'; btn.style.display=''; }, 1200);
}
window.addEventListener('load', function() {
  const k = localStorage.getItem('tsr_api_key');
  if (k) { const i=document.getElementById('api-input'),b=document.getElementById('api-btn'); if(i)i.value=k; if(b){b.textContent='✅ IA activa';b.style.background='#1a8a4e';} }
});
</script>

  <input type="password" id="api-input" placeholder="sk-ant-api03-..." style="width:100%;padding:9px 12px;border-radius:8px;border:none;font-size:12px;margin-bottom:10px;box-sizing:border-box;background:rgba(255,255,255,.95);color:#0f1b35;font-family:monospace"/>
  <div style="display:flex;gap:8px">
    <button onclick="_saveKey()" style="flex:1;background:#1a5cbf;color:#fff;border:none;padding:9px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600">💾 Guardar</button>
    <button onclick="document.getElementById('api-panel').style.display='none';document.getElementById('api-btn').style.display=''" style="background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:9px 14px;border-radius:8px;cursor:pointer;font-size:13px">✕</button>

  str = String(str).trim();

  m = str.match(/[?&]ll=(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/);
  if(m) return {lat:parseFloat(m[1]), lng:parseFloat(m[2])};
  return null;
};

  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#f0f4f8;--surface:#fff;--surface2:#e8eef5;--border:#c8d8e8;
    --accent:#1b4d8a;--accent2:#2369b5;--text:#0d1b2e;--muted:#5a7494;
    --green:#1a8a4e;--orange:#d97706;--red:#dc2626;--purple:#7c3aed;
    --accent-light:#e8f0fb;
  }
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
  .app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{width:226px;background:#0f1b35;}display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:100;flex-shrink:0;}
  .sidebar-brand{padding:14px 16px 12px;border-bottom:1px solid rgba(255,255,255,.07);background:transparent;}
  .brand-logo{width:100%;max-width:158px;display:block;margin:0 auto;height:auto;}
  .brand-sub{font-size:9px;color:#1b4d8a;text-transform:uppercase;letter-spacing:1px;text-align:center;margin-top:2px;font-weight:600;}
  .nav{flex:1;padding:8px 0;overflow-y:auto;}
  .nav-group{padding:8px 14px 3px;font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:1px;}
  .nav-group-label{padding:14px 16px 4px;font-size:9.5px;font-weight:600;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:2px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 14px;margin:1px 8px;border-radius:8px;cursor:pointer;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;transition:all .15s;user-select:none;}
  .sidebar-user{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;flex-shrink:0;background:rgba(0,0,0,.2);}
  .nav-item:hover:not(.active){color:rgba(255,255,255,.9);background:rgba(255,255,255,.06);}
  .nav-item.active{color:#fff;background:rgba(255,255,255,.12);}
  .nav-icon{font-size:14px;width:17px;text-align:center;}
  .sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);}
  .taller-info{font-size:10px;color:rgba(255,255,255,.45);}
  .taller-info strong{color:rgba(255,255,255,.8);display:block;font-size:11.5px;margin-bottom:1px;}

  /* MAIN */
  .main{margin-left:226px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
  .page-title{font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:1px;color:var(--text);}
  .date-badge{font-size:11.5px;color:var(--muted);background:var(--surface2);padding:5px 11px;border-radius:6px;border:1px solid var(--border);}
  .content{padding:20px 26px;flex:1;}

  /* CARDS */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .card-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
  .card-body{padding:16px;}

  /* STAT CARDS */
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;position:relative;overflow:hidden;}
  .stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
  .stat-card.c-yellow::after{background:#f59e0b;}
  .stat-card.c-red::after{background:var(--red);}
  .stat-card.c-green::after{background:var(--green);}
  .stat-card.c-blue::after{background:var(--accent);}
  .stat-card.c-purple::after{background:var(--purple);}
  .stat-card.c-orange::after{background:var(--orange);}
  .stat-card.c-teal::after{background:#0d9488;}
  .stat-card.c-pink::after{background:#db2777;}
  .stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
  .stat-value{font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;color:var(--text);margin-bottom:3px;}
  .stat-sub{font-size:10.5px;color:var(--muted);}

  /* ACCOUNT CARDS */
  .account-card{border-radius:10px;padding:16px;color:#fff;position:relative;overflow:hidden;}
  .account-card.efectivo{background:linear-gradient(135deg,#1a8a4e,#15703f);}
  .account-card.bancaria{background:linear-gradient(135deg,#1b4d8a,#163f72);}
  .account-card.credito{background:linear-gradient(135deg,#374151,#1f2937);}
  .account-label{font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
  .account-val{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;}
  .account-sub{font-size:10px;opacity:.65;margin-top:3px;}

  /* TABLE */
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{padding:8px 12px;text-align:left;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);}
  td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--surface2);}

  /* BADGES */
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;white-space:nowrap;}
  .badge-green {background:rgba(26,138,78,.12); color:#1a8a4e;}
  .badge-yellow{background:rgba(245,158,11,.12);color:#d97706;}
  .badge-orange{background:rgba(217,119,6,.12); color:#d97706;}
  .badge-red   {background:rgba(220,38,38,.12); color:#dc2626;}
  .badge-blue  {background:rgba(27,77,138,.12); color:#1b4d8a;}
  .badge-gray  {background:rgba(90,116,148,.12);color:#5a7494;}
  .badge-purple{background:rgba(124,58,237,.12);color:#7c3aed;}
  .badge-teal  {background:rgba(13,148,136,.12);color:#0d9488;}

  /* BUTTONS */
  .btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;font-size:12.5px;font-weight:500;cursor:pointer;border:none;transition:all .15s;font-family:'DM Sans',sans-serif;}
  .btn-primary{background:var(--accent);color:#fff;} .btn-primary:hover{background:#163f72;}
  .btn-success{background:var(--green);color:#fff;}  .btn-success:hover{background:#136e3d;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);} .btn-ghost:hover{color:var(--text);border-color:#8aa8c8;}
  .btn-danger{background:rgba(220,38,38,.08);color:#dc2626;border:1px solid rgba(220,38,38,.25);}
  .btn-sm{padding:5px 10px;font-size:12px;} .btn-xs{padding:3px 7px;font-size:11px;}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(13,27,46,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:620px;max-height:93vh;overflow-y:auto;box-shadow:0 8px 32px rgba(13,27,46,.18);}
  .modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .modal-title{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1px;}
  .modal-body{padding:20px;} .modal-footer{padding:13px 20px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;}

  /* FORM */
  .form-group{margin-bottom:13px;}
  .form-label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
  .form-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 11px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;transition:border-color .15s;}
  .form-input:focus{outline:none;border-color:var(--accent);}
  .form-select{appearance:none;cursor:pointer;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
  .form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;}

  /* CONFIG TABS */
  .cfg-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:18px;overflow-x:auto;flex-wrap:nowrap;white-space:nowrap;scrollbar-width:none;}
  .cfg-tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 16px;cursor:pointer;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap;flex-shrink:0;}
  .cfg-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .cfg-tab:hover{color:var(--text);}

  /* SERVICIOS CHECK */
  .servicios-check{display:flex;flex-direction:column;gap:5px;max-height:220px;overflow-y:auto;}
  .servicio-item{display:flex;align-items:center;justify-content:space-between;padding:6px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:border-color .15s;}
  .servicio-item.selected{border-color:var(--accent);background:var(--accent-light);}
  .servicio-item label{cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:6px;}
  @media (max-width:700px){.tarifa-divider{display:none;}}

  /* GRID */
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}

  /* BAR CHART */
  .bar-chart{display:flex;align-items:flex-end;gap:5px;height:100px;padding-top:8px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .bar{width:100%;border-radius:4px 4px 0 0;transition:height .3s;}
  .bar-label{font-size:9.5px;color:var(--muted);text-align:center;}
  .bar-val{font-size:9.5px;color:var(--accent);font-weight:600;}

  /* AI */
  .ai-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;height:400px;}
  .ai-messages{flex:1;overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:9px;}
  .ai-msg{max-width:85%;} .ai-msg.user{align-self:flex-end;} .ai-msg.bot{align-self:flex-start;}
  .ai-bubble{padding:8px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;}
  .ai-msg.user .ai-bubble{background:var(--accent);color:#fff;border-radius:10px 10px 2px 10px;}
  .ai-msg.bot  .ai-bubble{background:var(--surface2);border:1px solid var(--border);border-radius:10px 10px 10px 2px;}
  .ai-input-row{padding:9px 13px;border-top:1px solid var(--border);display:flex;gap:7px;}
  .ai-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12.5px;}
  .ai-input:focus{outline:none;border-color:var(--accent);}
  .quick-btns{display:flex;flex-wrap:wrap;gap:5px;padding:0 13px 9px;}
  .quick-btn{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-size:10.5px;color:var(--muted);cursor:pointer;transition:all .15s;}
  .quick-btn:hover{border-color:var(--accent);color:var(--accent);}


  /* LOGIN */
  .login-bg{min-height:100vh;background:linear-gradient(135deg,#0d1b2e 0%,#1b4d8a 60%,#2369b5 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(13,27,46,.35);}
  .login-logo{width:180px;display:block;margin:0 auto 10px;}
  .login-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;text-align:center;color:var(--accent);margin-bottom:4px;}
  .login-sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:28px;}
  .login-error{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.25);border-radius:6px;padding:9px 13px;font-size:12.5px;color:#dc2626;margin-bottom:14px;}
  /* USER / ROLE */
  .user-pill{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .user-avatar-sm{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;}
  .user-name{font-size:11.5px;color:#fff;font-weight:500;line-height:1.2;}
  .user-rol-txt{font-size:10px;color:rgba(255,255,255,.5);text-transform:capitalize;}
  .btn-logout{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);border-radius:6px;padding:6px;font-size:11.5px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;text-align:center;}
  .btn-logout:hover{background:rgba(255,255,255,.2);color:#fff;}
  .rol-badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;}
  .rol-admin{background:rgba(27,77,138,.12);color:#1b4d8a;}
  .rol-tecnico{background:rgba(26,138,78,.12);color:#1a8a4e;}
  .rol-vendedor{background:rgba(124,58,237,.12);color:#7c3aed;}
  .audit-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .audit-row:last-child{border-bottom:none;}
  .audit-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .audit-dot.admin{background:#1b4d8a;} .audit-dot.tecnico{background:#1a8a4e;} .audit-dot.vendedor{background:#7c3aed;}
  .acceso-denegado{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:var(--muted);}
  .acceso-denegado .icon{font-size:48px;margin-bottom:12px;}

  /* MISC */
  .empty{text-align:center;padding:34px;color:var(--muted);font-size:13px;}
  .empty-icon{font-size:28px;margin-bottom:7px;}
  .tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:10.5px;color:var(--muted);margin:2px;}
  .avatar{width:29px;height:29px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
  .text-accent{color:var(--accent);} .text-muted{color:var(--muted);font-size:11.5px;}
  .flex{display:flex;} .items-center{align-items:center;} .gap-2{gap:8px;} .gap-3{gap:12px;}
  .mb-3{margin-bottom:12px;} .mb-4{margin-bottom:16px;} .mb-6{margin-bottom:20px;}
  .loader{display:inline-block;width:12px;height:12px;border:2px solid rgba(27,77,138,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .pill-borrador{background:#f1f5f9;color:#64748b;border:1px solid #cbd5e1;}
  .pill-enviado{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;}
  .pill-aceptado{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;}
  .pill-rechazado{background:#fff1f2;color:#e11d48;border:1px solid #fecdd3;}
  .anticipo-box{background:linear-gradient(135deg,#e8f0fb,#d1e3fa);border:1px solid #b8d0f0;border-radius:8px;padding:13px 15px;}
  .saldo-highlight{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--accent);}
  .tag-metodo-efectivo{background:rgba(26,138,78,.1);color:#1a8a4e;padding:2px 7px;border-radius:4px;font-size:10.5px;font-weight:600;}
  .tag-metodo-bancaria{background:rgba(27,77,138,.1);color:#1b4d8a;padding:2px 7px;border-radius:4px;font-size:10.5px;font-weight:600;}
  .tag-metodo-cuentaspagar{background:rgba(124,58,237,.1);color:#7c3aed;padding:2px 7px;border-radius:4px;font-size:10.5px;font-weight:600;}
  .list-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;margin-bottom:5px;}
  .section-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;margin-top:18px;}
